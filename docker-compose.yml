# Subnet Whisperer
#
#   SQLite (default):   docker compose up web
#   PostgreSQL:         POSTGRES_PASSWORD=... docker compose --profile postgres up web-postgres db
#
# Values come from your shell or from a .env file next to this file
# (see .env.example). Empty values are treated as "not set" by the app.
#
# Encryption key: if ENCRYPTION_KEY is not set, the app creates
# instance/.encryption_key in the bind-mounted ./instance folder on first start.
# Keep and back up that file: without it stored credentials cannot be decrypted.

x-app-environment: &app-environment
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  # Legacy key derivation only (no default). See "Upgrading" in README.md.
  FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
  SESSION_SECRET: ${SESSION_SECRET:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  COMMAND_SANITIZATION: ${COMMAND_SANITIZATION:-enabled}
  SSH_HOST_KEY_POLICY: ${SSH_HOST_KEY_POLICY:-tofu}
  MAX_SCAN_IPS: ${MAX_SCAN_IPS:-65536}
  MAX_CONCURRENCY: ${MAX_CONCURRENCY:-100}
  START_SCHEDULER: ${START_SCHEDULER:-true}

services:
  web:
    build: .
    ports:
      # Host port: set HOST_PORT if 5000 is taken (on macOS, AirPlay Receiver uses 5000)
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - ./instance:/app/instance
      - ./logs:/app/logs
    environment:
      <<: *app-environment
      DATABASE_URL: ${DATABASE_URL:-sqlite:///instance/subnet_whisperer.db}
    restart: unless-stopped

  web-postgres:
    build: .
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - ./instance:/app/instance
      - ./logs:/app/logs
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-subnet_whisperer}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - postgres

  db:
    image: postgres:15
    # Not published on the host: only the web-postgres container can reach it.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Required. The postgres image refuses to initialise without a password,
      # and docker-start.sh / `make run-postgres` check it before starting.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-subnet_whisperer}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    profiles:
      - postgres

volumes:
  postgres_data:
