[project]
name = "subnet-whisperer"
version = "0.1.0"
description = "Web-based tool for scanning subnets and running commands over SSH, with encrypted credential storage and scheduled scans"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "flask-wtf>=1.2.2",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "pandas>=2.2.3",
    "paramiko>=3.5.1",
    "psycopg2-binary>=2.9.10",
    "wtforms>=3.2.1",
    "flask-login>=0.6.3",
    "matplotlib>=3.10.1",
    "sqlalchemy>=2.0.40",
    "bcrypt>=4.3.0",
    "cryptography>=44.0.2",
]
